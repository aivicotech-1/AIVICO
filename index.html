<html lang="en" data-theme="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aivico is a premier software engineering & AI studio. We architect intelligent systems, mission-critical cloud backends, and high-performance digital products." />
    <meta property="og:title" content="Aivico | Enterprise Software Engineering & Autonomous AI Systems" />
    <meta property="og:description" content="Architecting Next-Generation Software & Intelligent Systems for Industry Leaders." />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://aivico.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body>
    <script>
      // Run synchronously before React renders to avoid theme flash on refresh
      try {
        var t = localStorage.getItem('aivico-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
